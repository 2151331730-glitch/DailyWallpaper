[app]
data_dir = "data"
daily_time = "08:30"
latest_change_time = "22:00"
timezone = "Asia/Shanghai"
start_with_windows = false
manual_change_counts_toward_daily_limit = true
allow_manual_override_after_daily_change = false
max_analyses_per_day = 40
max_downloads_per_day = 60
log_level = "INFO"

[sources]
wallhaven_enabled = true
bing_enabled = true
# 启动时如果检测到 Wallpaper Engine 和它的工坊目录，会自动改成 true。
we_workshop_enabled = false
allow_mature = false
wallhaven_categories = "111"
min_width = 2560
min_height = 1440
aspect_min = 1.70
aspect_max = 1.85
max_image_mb = 40
max_video_mb = 500
wallhaven_pages = 6
# Pigeon/Clash users: point this at the local mixed proxy. Without it,
# requests ignores the Windows system proxy and Wallhaven/Steam time out.
proxy = ""

[vision]
provider = "zhipu"
screen_model = "glm-4.6v-flash"
review_model = "glm-4.6v"
review_top_n = 5
prompt_version = "v1"
max_output_tokens = 500
temperature = 0.2

[vision.pricing."glm-4.6v"]
input_cny_per_million = 1.0
output_cny_per_million = 3.0

[vision.pricing."glm-4.6v-flash"]
input_cny_per_million = 0.0
output_cny_per_million = 0.0

[budget]
monthly_cny = 10.0
warn_ratio = 0.80

[weather]
enabled = true
city = "北京"
latitude = 39.9075
longitude = 116.39723
cache_minutes = 60

[wallpaper]
style = "fill"
monitor = 0
# 一个池子一个标准：静态图和动态壁纸一起打分排序，分数达到这条线就够格上桌面。
# 不再有"动态日/静态日"，也不再拿两种类型的最分互相比较。
min_score = 45.0
# 唯一的类型限制：动态壁纸耗电，没插电时跳过。
dynamic_requires_ac = true
# 以下几项是旧版"动态日/静态日"计划用的，现在没有代码读取，保留只为让老配置能解析。
media_strategy = "mixed"
dynamic_every_n_days = 3
selection_margin = 0.0
dynamic_max_streak = 2
dynamic_quota_days = 10
dynamic_quota_max = 5

[wallpaper_engine]
# 留空即可：启动时会读注册表和 Steam 的 steamapps/libraryfolders.vdf，
# 自动找到 Wallpaper Engine。只有自动识别失败时才在这里手填。
install_dir = ""
config_path = ""
# 设为 false 则完全不自动探测，install_dir 写什么就用什么。
auto_detect = true

[tools]
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"

[retention]
wallpapers_days = 90
cache_days = 180
log_mb = 5
log_backups = 5

# Online Wallpaper Engine workshop items. One-time setup:
#   1. scripts/set_steam_key.py   (free key from steamcommunity.com/dev/apikey)
#   2. scripts/install_steamcmd.py
#   3. scripts/steam_login.py     (account that owns Wallpaper Engine)
[steam_workshop]
enabled = false
query_type = 3          # 3 = trend, 9 = most subscriptions
days = 30
per_page = 50
prefetch_top_n = 6
max_cache_gb = 4.0
steamcmd_path = ""      # empty -> <data>/tools/steamcmd/steamcmd.exe
steam_account = ""      # username only; the password is never stored
download_timeout = 1800
